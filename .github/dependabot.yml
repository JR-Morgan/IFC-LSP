version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: [/server, /clients/zed]
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
      default-days: 14
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /clients/vscode
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
