[package]
name = "zed-ifc"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["Jedd Morgan"]
repository = "https://github.com/JR-Morgan/IFC-LSP"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
