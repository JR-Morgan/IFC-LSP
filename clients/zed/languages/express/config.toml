name = "EXPRESS"
grammar = "express"
path_suffixes = ["exp"]
line_comments = ["-- "]
block_comment = ["(* ", " *)"]
tab_size = 4
hard_tabs = true
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
