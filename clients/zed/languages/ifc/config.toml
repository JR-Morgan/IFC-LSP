name = "IFC"
grammar = "ifc"
path_suffixes = ["ifc", "stp", "step", "p21"]
block_comment = ["/* ", " */"]
word_characters = ["#"]
tab_size = 2
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
