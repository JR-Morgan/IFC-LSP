[package]
name = "ifc-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for IFC (ISO 10303-21 STEP) files"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ifc-lsp"
path = "src/main.rs"

[lib]
name = "ifc_lsp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
log = "0.4.35"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
memchr = "2.8.3"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = 1
